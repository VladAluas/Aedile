name: aedile

services:
  db:
    image: postgres:15
    restart: unless-stopped

    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: demoPa5s!
      POSTGRES_DB: demodb

    ports:
      - "5432:5432"

    volumes:
      - db_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d demodb"]
      interval: 5s
      timeout: 3s
      retries: 20

  storage:
    image: minio/minio
    restart: unless-stopped

    command: server /data --console-address ":9001"

    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: demoP@ss!

    ports:
      - "9000:9000"
      - "9001:9001"

    volumes:
      - storage_data:/data

  liquibase:
    image: liquibase/liquibase:latest

    depends_on:
      db:
        condition: service_healthy

    volumes:
      - ./liquibase/changelog:/liquibase/changelog:ro
      - ./liquibase/liquibase.properties:/liquibase/liquibase.properties:ro
      - ./liquibase/drivers:/liquibase/lib:ro

    command:
      - "--defaults-file=/liquibase/liquibase.properties"
      - "update"

    profiles:
      - tools

volumes:
  db_data:
  storage_data:
