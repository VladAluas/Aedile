project:
  name: demo
  environment: dev

compose:
  file: infrastructure/docker-compose.yaml

docker:
  project: demo

metadata:
  engine: postgres
  image: postgres:17
  host: localhost
  port: 5432
  user: myuser
  pass: metaPa5s!
  name: metadb

storage:
  image: minio/minio
  user: admin
  pass: demoP@ss!
  api_port: 9000
  web_port: 9001
