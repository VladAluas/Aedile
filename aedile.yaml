project:
  name: demo
  environment: dev

compose:
  file: infrastructure/docker-compose.yaml

docker:
  project: demo

metadata:
  engine: postgres
  image: postgres:17
  host: localhost
  port: 5432
  name: metadb

storage:
  image: quay.io/minio/aistor/minio
  api_port: 9000
  web_port: 9001
  command: "server /data --console-address "
  storage: storage_data

liquibase:
  image: liquibase/liquibase:latest
  working_dir: /liquibase/changelog
  changelog: "./liquibase/changelog:/liquibase/changelog"
  properties: "./liquibase/liquibase.properties:/liquibase/liquibase.properties"
  lib: "./liquibase/drivers:/liquibase/lib"
  dependency: "metadata_db"

etl:
  image: docker.io/vladaluas/sisyphus
  tag: 0.10.0

openbao:
  enabled: true
  image: quay.io/openbao/openbao:2.5
  container: demo_openbao
  host: localhost
  port: 8200
  data: openbao_data
  mount: secret

secrets:
  metadata:
    username: myuser
    password: metaPa5s!

  storage:
    username: admin
    password: demoP@ss!
